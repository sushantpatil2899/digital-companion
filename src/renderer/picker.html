<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Pick your companion</title>
    <style>
      :root {
        --bg: #fdfaf2;
        --card: #ffffff;
        --ink: #3a2d25;
        --muted: #8a7a6c;
        --line: #eadfcf;
        --accent: #df6166;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2d2925;
          --card: #3a352f;
          --ink: #f4ece0;
          --muted: #b3a593;
          --line: #4a433b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        user-select: none;
      }
      header {
        padding: 18px 22px 4px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      header p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      #row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        padding: 14px 18px 22px;
      }
      .choice {
        position: relative;
        width: 200px;
        height: 320px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.2s, transform 0.2s;
      }
      .choice.open {
        border-color: var(--accent);
        transform: translateY(-3px);
      }
      .choice.current::after {
        content: 'Now on your screen';
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--line);
        font-size: 10px;
        color: var(--muted);
      }
      .choice.open::after {
        opacity: 0;
      }
      canvas {
        display: block;
        width: 200px;
        height: 230px;
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      /* Make room for the card: the character moves up a little. */
      .choice.open canvas {
        transform: translateY(-48px) scale(0.72);
      }
      .name {
        text-align: center;
        font-weight: 700;
        font-size: 15px;
      }
      /* The card that slides up on hover. */
      .card {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 14px 14px;
        background: var(--card);
        border-top: 1px solid var(--line);
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        max-height: 58%;
        overflow: hidden;
      }
      .choice.open .card {
        transform: translateY(0);
      }
      .card h2 {
        margin: 0 0 2px;
        font-size: 15px;
      }
      .card .concept {
        margin: 0 0 4px;
        font-weight: 600;
        font-size: 12px;
      }
      .card .info {
        margin-top: 8px;
        padding: 3px 12px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: transparent;
        border: 1.5px solid var(--accent);
        border-radius: 999px;
        cursor: pointer;
      }
      .card .info:hover {
        background: var(--accent);
        color: #fff;
      }
      .card .self {
        margin: 0;
        color: var(--muted);
        font-size: 11.5px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pick your companion</h1>
      <p>Hover over one to meet them. Each one has their own mind and memories; you can switch any time from the menu.</p>
    </header>
    <div id="row"></div>
    <script src="../characters/togepi/look.js"></script>
    <script src="../characters/pip/look.js"></script>
    <script src="../characters/mori/look.js"></script>
    <script src="../characters/nomi/look.js"></script>
    <script src="../characters/tonk/look.js"></script>
    <script src="../characters/wolfie/look.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
