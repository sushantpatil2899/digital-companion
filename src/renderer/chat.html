<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Chat with Togepi</title>
    <style>
      :root {
        --bg: #fdfaf2;
        --card: #ffffff;
        --ink: #3a2d25;
        --muted: #8a7a6c;
        --line: #eadfcf;
        --you: #ffe9a8;
        --him: #ffffff;
        --ask: #eaf2fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2d2925;
          --card: #3a352f;
          --ink: #f4ece0;
          --muted: #b3a593;
          --line: #4a433b;
          --you: #6b5a2e;
          --him: #3a352f;
          --ask: #2f3a46;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      header {
        padding: 12px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        max-width: 80%;
        padding: 7px 11px;
        border-radius: 14px;
        border: 1px solid var(--line);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .you {
        align-self: flex-end;
        background: var(--you);
        border-bottom-right-radius: 4px;
      }
      .him {
        align-self: flex-start;
        background: var(--him);
        border-bottom-left-radius: 4px;
      }
      .note {
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      #question {
        display: none;
        margin: 0 14px 8px;
        padding: 8px 11px;
        border-radius: 12px;
        background: var(--ask);
        border: 1px solid var(--line);
      }
      #question small {
        display: block;
        color: var(--muted);
      }
      #status {
        min-height: 18px;
        padding: 0 16px 4px;
        color: var(--muted);
        font-size: 12px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--line);
      }
      input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 7px 12px;
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #mic {
        padding: 6px 10px;
      }
      #mic.on {
        background: #e9a23b;
        border-color: #e9a23b;
        color: #fff;
      }
      #mic[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Chat with <span class="name">Togepi</span></h1>
      <p>Today's chat. It starts fresh tomorrow; he keeps what matters in his diary.</p>
    </header>
    <div id="messages"></div>
    <div id="question"></div>
    <div id="status"></div>
    <form id="form">
      <input id="text" autocomplete="off" maxlength="1000" placeholder="Say something…" autofocus />
      <button id="mic" type="button" title="Say it (the microphone is only on while you talk)" hidden>🎤</button>
      <button id="send" type="submit">Send</button>
    </form>
    <script src="name.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
