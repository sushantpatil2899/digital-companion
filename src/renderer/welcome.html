<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Welcome to Togepi</title>
    <style>
      :root {
        --bg: #fdfaf2;
        --card: #ffffff;
        --ink: #3a2d25;
        --muted: #8a7a6c;
        --line: #eadfcf;
        --accent: #df6166;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2d2925;
          --card: #3a352f;
          --ink: #f4ece0;
          --muted: #b3a593;
          --line: #4a433b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      header {
        padding: 16px 18px 6px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      main {
        padding: 0 18px 12px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        margin-top: 12px;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      section p,
      li {
        margin: 0;
      }
      ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      li + li {
        margin-top: 3px;
      }
      .switch {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 10px;
        align-items: start;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .switch:first-of-type {
        border-top: none;
      }
      .switch input {
        margin: 2px 0 0;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      .switch label {
        font-weight: 600;
      }
      .switch small {
        grid-column: 2;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
        margin-bottom: 4px;
      }
      footer {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 10px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      footer small {
        color: var(--muted);
      }
      button {
        border: none;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 7px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Welcome!</h1>
      <p id="intro"></p>
    </header>
    <main>
      <div id="sections"></div>
      <section id="perms">
        <h2>What may I look at?</h2>
        <p class="muted" id="perms-help">Everything is off until you turn it on. You can change these later in my menu under Brain.</p>
        <div id="switches"></div>
      </section>
    </main>
    <footer>
      <small>Open this again any time: Welcome and what’s new… in my menu.</small>
      <button id="done">Let’s go!</button>
    </footer>
    <script src="welcome.js"></script>
  </body>
</html>
