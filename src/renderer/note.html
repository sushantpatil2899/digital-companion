<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Remind me</title>
    <style>
      :root {
        --bg: #fdfaf2;
        --panel: #ffffff;
        --ink: #3a2d25;
        --muted: #8a7a6c;
        --line: #eadfcf;
        --track: #f1eadf;
        --good: #6cb86a;
        --warn: #e5a93c;
        --bad: #df6166;
        --accent: #5c9bc8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #23201d;
          --panel: #2d2925;
          --ink: #f4ece0;
          --muted: #b3a593;
          --line: #403a33;
          --track: #3a352f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      textarea {
        width: 100%;
        height: 64px;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      textarea:focus,
      input:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .when {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 14px;
        padding: 5px 11px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .at {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      input[type='time'] {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 6px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        border-top: 1px solid var(--line);
      }
      li:first-child {
        border-top: 0;
      }
      li .text {
        flex: 1;
        overflow-wrap: anywhere;
      }
      li .time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      li button {
        padding: 1px 8px;
      }
      .muted {
        color: var(--muted);
      }
      #status {
        min-height: 18px;
        margin-top: 6px;
        color: var(--good);
      }
    </style>
  </head>
  <body>
    <h2>Remind me about</h2>
    <div class="card">
      <textarea id="text" maxlength="120" placeholder="e.g. Call Mom back" autofocus></textarea>
      <div class="when" id="quick">
        <button data-min="10">in 10 min</button>
        <button data-min="20">20 min</button>
        <button data-min="30">30 min</button>
        <button data-min="60">1 hour</button>
        <button data-min="120">2 hours</button>
      </div>
      <div class="at"><span class="muted">or at</span><input type="time" id="time" /><button id="atBtn">Set</button></div>
      <div id="status"></div>
    </div>

    <h2>Coming up</h2>
    <div class="card"><ul id="list"></ul></div>

    <script src="note.js"></script>
  </body>
</html>
