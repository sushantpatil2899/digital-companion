<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Togepi's brain</title>
    <style>
      :root {
        --bg: #fdfaf2;
        --panel: #ffffff;
        --ink: #3a2d25;
        --muted: #8a7a6c;
        --line: #eadfcf;
        --track: #f1eadf;
        --good: #6cb86a;
        --warn: #e5a93c;
        --bad: #df6166;
        --accent: #5c9bc8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #23201d;
          --panel: #2d2925;
          --ink: #f4ece0;
          --muted: #b3a593;
          --line: #403a33;
          --track: #3a352f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 78px 1fr 40px;
        align-items: center;
        gap: 8px;
        margin: 5px 0;
      }
      .bar {
        height: 9px;
        border-radius: 5px;
        background: var(--track);
        overflow: hidden;
        position: relative;
      }
      .bar > i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        border-radius: 5px;
        transition: width 0.4s, left 0.4s;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .state {
        font-size: 15px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 3px 0;
        vertical-align: top;
      }
      td:first-child {
        color: var(--muted);
        width: 92px;
      }
      .score td:first-child {
        color: var(--ink);
        font-weight: 600;
        width: 92px;
      }
      .why {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Doing</h2>
    <div class="card"><div class="state" id="state">…</div><div class="muted" id="sub"></div></div>

    <h2>Needs &amp; mood</h2>
    <div class="card" id="needs"></div>

    <h2>What he's noticing</h2>
    <div class="card"><table id="context"></table></div>

    <h2>Last decision (top choices)</h2>
    <div class="card"><table id="scores"></table></div>

    <script src="brain.js"></script>
  </body>
</html>
