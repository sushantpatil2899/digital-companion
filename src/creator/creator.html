<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
    <title>Character creator</title>
    <style>
      :root {
        --bg: #f4f1ec;
        --panel: #ffffff;
        --line: #e2ddd5;
        --text: #2e2420;
        --muted: #8a7f76;
        --accent: #d4635f;
        --accent-soft: #fbe3e1;
        --field: #faf8f5;
        --stage-light: #e9eef5;
        --stage-dark: #2a2d3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1917;
          --panel: #252220;
          --line: #3a3532;
          --text: #eee6df;
          --muted: #9b918a;
          --accent: #ef8a84;
          --accent-soft: #452826;
          --field: #1f1c1a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: grid;
        grid-template-columns: 340px 1fr;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100vh;
      }
      header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
      h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      h1 img { width: 22px; height: 22px; }
      .tabs { display: flex; gap: 4px; margin-top: 10px; }
      .tabs > button, .more { flex: 1 1 auto; }
      .tabs button { white-space: nowrap; padding: 4px 6px; }
      .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .more { position: relative; display: flex; }
      .more > button { flex: 1; }
      .more[hidden] { display: none; }
      #debug { position: fixed; right: 14px; bottom: 8px; z-index: 6; display: flex; gap: 5px; align-items: center; color: var(--muted); font-size: 12px; }
      #moreMenu { position: absolute; top: 100%; right: 0; min-width: 100%; white-space: nowrap; margin-top: 4px; z-index: 5; display: flex; flex-direction: column; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12); }
      #moreMenu[hidden] { display: none; }
      #moreMenu button { text-align: left; background: transparent; border-color: transparent; }
      #moreMenu button:hover { background: var(--accent-soft); }
      /* Personality tab */
      .card { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: center; margin-bottom: 4px; }
      .portrait { width: 88px; height: 96px; }
      .card h3 { margin: 0; font-size: 20px; }
      .tagline { color: var(--accent); font-weight: 600; margin: 2px 0 0; }
      .prose { margin: 4px 0; }
      .prose p { margin: 4px 0; }
      .tag { display: inline-block; background: var(--accent-soft); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
      .pslider { margin: 2px 0 7px; }
      .pslider .top { display: grid; grid-template-columns: 128px 1fr 26px; gap: 8px; align-items: center; }
      .pslider .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pslider output { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 11px; }
      .bar { position: relative; height: 6px; background: var(--line); border-radius: 3px; }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
      .bar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
      .why { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
      .panel { overflow-y: auto; padding: 12px 16px 24px; flex: 1; }
      .panel[hidden] { display: none; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
      h2:first-child { margin-top: 0; }
      button, select, input[type='text'], input[type='number'], textarea {
        font: inherit;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      select, input[type='text'] { width: 100%; }
      textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 11px; }
      .row { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; margin: 3px 0; }
      .row.wide { grid-template-columns: 96px 1fr; }
      .row label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row output { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 11px; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
      .checks label { display: flex; gap: 6px; align-items: center; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      .chips button { padding: 2px 8px; font-size: 12px; }
      .scene { display: flex; width: 100%; text-align: left; margin: 2px 0; justify-content: space-between; }
      .scene.on { background: var(--accent-soft); border-color: var(--accent); }
      .scene small { color: var(--muted); }
      main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .toolbar label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
      .toolbar select { width: auto; }
      .sep { width: 1px; height: 20px; background: var(--line); }
      .stageRow { flex: 1; display: flex; min-height: 0; }
      #stageWrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px; }
      #stageBox { position: relative; outline: 1px dashed var(--muted); outline-offset: 0; }
      #stageBox.light { background: var(--stage-light); }
      #stageBox.dark { background: var(--stage-dark); }
      #stageBox.checker { background: repeating-conic-gradient(#d8d8d8 0 25%, #f2f2f2 0 50%) 0 0 / 16px 16px; }
      /* Simulation tab: the stage is a bordered world he lives in, with a floor. */
      #stageWrap.sim { padding: 20px; overflow: hidden; align-items: stretch; justify-content: stretch; }
      #stageBox.arena { flex: 1; outline: none; overflow: hidden; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(40, 30, 20, 0.1), inset 0 0 0 6px rgba(255, 255, 255, 0.35); touch-action: none; }
      #stageBox.arena.light { background: linear-gradient(180deg, #d9e6f5 0%, #eef1f2 70%, #f4efe4 100%); }
      #stageBox.arena.dark { background: linear-gradient(180deg, #171a2c 0%, #262a40 75%, #2e2b33 100%); }
      #stageBox.arena #stage { pointer-events: none; }
      #stageBox.arena #poseCanvas { display: none; }
      #floor { display: none; position: absolute; left: 0; right: 0; bottom: 0; }
      #stageBox.arena #floor { display: block; background: linear-gradient(180deg, #a9c98a 0, #8fb26f 5px, #c9b38c 6px, #b59b72 100%); box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.15); }
      #stageBox.arena.dark #floor { background: linear-gradient(180deg, #4d6b45 0, #3e5a38 5px, #4a4036 6px, #3a322b 100%); }
      #stageBox.arena.over { cursor: grab; }
      #stageBox.arena.holding { cursor: grabbing; }
      .need .bar i { transition: width 0.25s; }
      #stage, #poseCanvas { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: transparent; }
      #poseCanvas { width: 100%; height: 100%; transform: none; }
      #items { width: 150px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
      #items[hidden] { display: none; }
      #items h2 { margin: 10px 10px 6px; }
      #itemNew { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 4px; }
      #itemNew input { font-size: 12px; }
      #itemNew .hint { margin: 0; font-size: 11px; }
      #itemNew .err { color: var(--accent); }
      #itemStrip { flex: 1; overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; scroll-snap-type: y proximity; }
      .tile { scroll-snap-align: start; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 11px; color: var(--muted); }
      .tile img { width: 96px; height: 96px; object-fit: contain; border-radius: 4px; background: repeating-conic-gradient(var(--line) 0 25%, transparent 0 50%) 0 0 / 12px 12px; }
      .tile span { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tile.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
      .tile.drawing { cursor: progress; border-style: dashed; }
      .tile.drawing .spin { width: 96px; height: 96px; display: grid; place-items: center; font-size: 22px; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.3; } }
      .status { padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; padding-right: 96px; gap: 16px; }
      .status b { color: var(--text); font-weight: 600; }
      .muted { color: var(--muted); }
      .hint { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <h1><img id="tray" alt="" hidden /> Character creator</h1>
        <select id="character"></select>
        <div class="tabs">
          <button data-tab="personality">Personality</button>
          <button data-tab="sim">Simulation</button>
          <button data-tab="scenes">Scenes</button>
          <span class="more">
            <button id="moreBtn" aria-haspopup="true">More ▾</button>
            <span id="moreMenu" hidden>
              <button data-tab="state">State</button>
              <button data-tab="pose">Raw pose</button>
            </span>
          </span>
        </div>
      </header>
      <section class="panel" id="tab-scenes">
        <p class="hint">Scripted frames played through the real renderer. Click and drag the character to pick them up.</p>
        <div class="checks"><label><input type="checkbox" id="loop" /> Loop scene</label></div>
        <div id="sceneList"></div>
      </section>
      <section class="panel" id="tab-personality" hidden></section>
      <section class="panel" id="tab-sim" hidden></section>
      <section class="panel" id="tab-state" hidden></section>
      <section class="panel" id="tab-pose" hidden></section>
    </aside>
    <main>
      <div class="toolbar">
        <button id="play">Pause</button>
        <button id="step" title="Advance one frame (when paused)">Step</button>
        <button id="restart">Restart</button>
        <label>Speed
          <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
        </label>
        <span class="sep"></span>
        <label>Zoom
          <select id="zoom"><option>1</option><option>1.5</option><option selected>2</option><option>3</option><option>4</option></select>
        </label>
        <label>Window
          <select id="size"><option value="220x256">Real (220×256)</option><option value="360x300">Wide (360×300)</option></select>
        </label>
        <label>Backdrop
          <select id="backdrop"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option><option value="checker">Checker</option></select>
        </label>
        <span class="sep"></span>
        <label><input type="checkbox" id="follow" /> Eyes follow mouse</label>
        <label><input type="checkbox" id="sound" /> Sound</label>
        <label><input type="checkbox" id="guides" /> Guides</label>
      </div>
      <div class="stageRow">
        <div id="stageWrap">
          <div id="stageBox" class="light">
            <div id="floor"></div>
            <iframe id="stage" title="Stage"></iframe>
            <canvas id="poseCanvas"></canvas>
          </div>
        </div>
        <div id="items">
          <h2>Items</h2>
          <form id="itemNew">
            <input type="text" id="itemDesc" placeholder="New item: a red mug" maxlength="80" />
            <input type="text" id="itemRecolour" placeholder="Colours (optional): make it look like a panda" maxlength="200" />
            <!-- Enter submits from either box (two text boxes need a submit button). -->
            <button type="submit" tabindex="-1" style="position: absolute; left: -9999px">Make</button>
            <p class="hint" id="itemNote">Up to 10 words.</p>
          </form>
          <div id="itemStrip"></div>
        </div>
      </div>
      <div class="status" id="status"></div>
    </main>
    <label id="debug" title="Show the More tab: every frame field and the raw pose, by hand"><input type="checkbox" id="debugBox" /> Debug</label>
    <script src="/src/creator/scenes.js"></script>
    <script src="/src/renderer/item.js"></script>
    <script src="/src/creator/creator.js"></script>
  </body>
</html>
